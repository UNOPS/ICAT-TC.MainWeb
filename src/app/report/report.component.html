<div class="container pl-20 pr-20">
    <h4 class="mt-4">Reports
        <span (click)="watchVideo()" pTooltip="Click to watch guidance video"  class="infor-video" ><i class="pi pi-video" style=" font-size: 1em ;  margin-left: 1em;"></i></span>
    </h4>
    <div class="p-grid p-fluid card">
        <div class="row mb-3">
            <div class="col-md-4"></div>
            <div class="col-md-4">
            </div>
            <div class="col-md-4">
                <div class="p-inputgroup pt-4">
                    <input placeholder="Type your keyword" [(ngModel)]="searchBy.text" #nameClimate="ngModel"
                        type="text" name="nameClimate" class="p-inputtext" pInputText />
                    <button type="button" pButton pRipple label="Search" (click)="onSearch()"></button>
                </div>
            </div>
        </div>
       
        <div class="row mb-3"></div>
        <h6 class="mt-4" style="color: #1a4f7b">Reports</h6>
        <div class="row">
            <div style="padding: 10px; cursor: pointer;" class="col-md-4 col-xs-6" *ngFor="let r of pdfFiles">
                <div class="row  d-flex justify-content-center">
                    <img (click)="view(r)" src="./assets/images/pdf.webp" style="display: block; min-width:120px;max-width: 120px;">
                </div>
                <div class="row d-flex justify-content-center">
                    <span class="row d-flex justify-content-center" (click)="view(r)">{{r.reportName}}</span>
                </div>
                <div class="row d-flex justify-content-center mt-1">
                    <button pButton type="button" icon="pi pi-trash" class="p-button-danger p-button-text p-button-sm" pTooltip="Delete report" (click)="deleteReport(r)"></button>
                </div>
            </div>
        </div>
    </div>
<p-confirmDialog></p-confirmDialog>
